            ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(1024, 415, 9, 0, Math.PI * 2);
            ctx.fill();

            // Big Bold Hero Quote in Heavy Black Antique Italic
            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2.6;
            ctx.font = 'italic 800 88px "EB Garamond", "Playfair Display", serif';
            ctx.fillText(rightData.quote, 1024, 590);
            ctx.strokeText(rightData.quote, 1024, 590);

            // Drop Cap & Lead Paragraph
            ctx.textAlign = 'left';

            // Massive Antique Drop Cap in Pitch Black with Double Stroke
            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 6;
            ctx.font = '900 250px "Cinzel Decorative", "Cinzel", serif';
            ctx.fillText(rightData.dropCap, 210, 980);
            ctx.strokeText(rightData.dropCap, 210, 980);

            function wrapText(text, x, y, maxWidth, lineHeight, font, strokeWidth = 1.8) {
                ctx.font = font;
                ctx.fillStyle = '#000000';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = strokeWidth;
                const words = text.split(' ');
                let line = '';
                let currentY = y;
                for (let n = 0; n < words.length; n++) {
                    const testLine = line + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        ctx.fillText(line, x, currentY);
                        if (strokeWidth > 0) ctx.strokeText(line, x, currentY);
                        line = words[n] + ' ';
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, x, currentY);
                if (strokeWidth > 0) ctx.strokeText(line, x, currentY);
                return currentY + lineHeight;
            }

            // Lead text next to Drop Cap in Heavy Black Antique Serif
            let startY = 820;
            startY = wrapText(rightData.lead, 440, startY, 1360, 88, 'italic 800 72px "EB Garamond", "Playfair Display", serif', 2.0);

            // Body Paragraphs in Deep Heavy Black with Antique Serif
            let pY = Math.max(1110, startY + 45);
            for (const para of rightData.paragraphs) {
                pY = wrapText(para, 220, pY, 1580, 88, '700 66px "EB Garamond", "Playfair Display", serif', 1.8);
                pY += 38;
            }

            // Bottom Heavy Antique Flourish
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(830, 2520);
            ctx.lineTo(1218, 2520);
            ctx.stroke();

            // Bottom Page Number in Heavy Black
            ctx.textAlign = 'center';
            ctx.fillStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.font = '800 52px "Cinzel", serif';
            ctx.fillText(`—  PAGE ${rightData.pageNumber}  —`, 1024, 2635);
            ctx.strokeText(`—  PAGE ${rightData.pageNumber}  —`, 1024, 2635);

            return createHighResPageTexture(canvas);
        }

        /* -------------------------------------------------------------
           REFERENCE DESIGN: LUXURY COLLECTOR'S HARDCOVER
           (Rich Warm Brown Leather, Embossed Gold Borders & Centerpiece)
        ------------------------------------------------------------- */
        function createCollectorHardcoverTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 2880;
            const ctx = canvas.getContext('2d');

            // Rich Dark Brown / Warm Antique Leather-like Cover (matching reference)
            const grad = ctx.createLinearGradient(0, 0, 2048, 2880);
            grad.addColorStop(0, '#1c1109');
            grad.addColorStop(0.3, '#2a190e');
            grad.addColorStop(0.7, '#20130a');
            grad.addColorStop(1, '#150c06');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 2048, 2880);

            // Subtle fine leather grain texture
            ctx.fillStyle = 'rgba(255, 255, 255, 0.018)';
            for (let i = 0; i < 60000; i++) {
                ctx.fillRect(Math.random() * 2048, Math.random() * 2880, 2, 2);
            }

            // Ornate Golden Decorative Borders (Double Frame)
            ctx.strokeStyle = '#e5b85c';
            ctx.lineWidth = 14;
            ctx.strokeRect(90, 90, 1868, 2700);

            ctx.strokeStyle = '#8c5520';
            ctx.lineWidth = 4;
            ctx.strokeRect(122, 122, 1804, 2636);

            ctx.strokeStyle = '#fef1cf';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(140, 140, 1768, 2600);

            // Raised Golden Corner Ornaments
            function drawCornerOrnament(x, y, angle) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.strokeStyle = '#e5b85c';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(110, 0);
                ctx.arc(110, 110, 110, -Math.PI/2, Math.PI, true);
                ctx.stroke();

                ctx.fillStyle = '#e5b85c';
                ctx.beginPath();
                ctx.arc(55, 55, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            drawCornerOrnament(140, 140, 0);
            drawCornerOrnament(1908, 140, Math.PI/2);
            drawCornerOrnament(1908, 2740, Math.PI);
            drawCornerOrnament(140, 2740, -Math.PI/2);

            // Large Circular Decorative Centerpiece (Matching Reference Image)
            ctx.save();
            ctx.translate(1024, 950);

            // Glowing Golden Centerpiece Halo
            const halo = ctx.createRadialGradient(0, 0, 20, 0, 0, 280);
            halo.addColorStop(0, 'rgba(245, 200, 95, 0.45)');
            halo.addColorStop(0.5, 'rgba(217, 130, 30, 0.18)');
            halo.addColorStop(1, 'transparent');
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(0, 0, 280, 0, Math.PI * 2);
            ctx.fill();

            // Concentric Gold Filigree Rings
            ctx.strokeStyle = '#e5b85c';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(0, 0, 190, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = '#a67324';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, 160, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = '#fef1cf';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 130, 0, Math.PI * 2);
            ctx.stroke();

            // Sunburst / Astrolabe Rays in Centerpiece
            for (let i = 0; i < 24; i++) {
                const angle = (i * Math.PI * 2) / 24;
                ctx.strokeStyle = (i % 2 === 0) ? '#e5b85c' : '#fef1cf';
                ctx.lineWidth = (i % 2 === 0) ? 5 : 2.5;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * 70, Math.sin(angle) * 70);
                ctx.lineTo(Math.cos(angle) * 125, Math.sin(angle) * 125);
                ctx.stroke();
            }

            // Center Open Book Emblem in 24K Gold
            ctx.fillStyle = '#e5b85c';
            ctx.beginPath();
            ctx.moveTo(0, -35);
            ctx.bezierCurveTo(45, -60, 90, -40, 95, -35);
            ctx.lineTo(95, 45);
            ctx.bezierCurveTo(90, 40, 45, 20, 0, 45);
            ctx.bezierCurveTo(-45, 20, -90, 40, -95, 45);
            ctx.lineTo(-95, -35);
            ctx.bezierCurveTo(-90, -40, -45, -60, 0, -35);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#8c5520';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, -35);
            ctx.lineTo(0, 45);
            ctx.stroke();
            ctx.restore();

            // Book Title: BookBridge in Elegant Gold Typography
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 170px "Cinzel", serif';
            ctx.shadowColor = 'rgba(229, 184, 92, 0.75)';
            ctx.shadowBlur = 40;
            ctx.fillText('BookBridge', 1024, 1500);

            // Subtitle: Exchange • Discover • Read
            const goldTextGrad = ctx.createLinearGradient(350, 1620, 1698, 1620);
            goldTextGrad.addColorStop(0, '#e5b85c');
            goldTextGrad.addColorStop(0.5, '#fef1cf');
            goldTextGrad.addColorStop(1, '#c28828');
            ctx.fillStyle = goldTextGrad;
            ctx.shadowBlur = 18;
            ctx.font = '700 54px "Cinzel", serif';
            ctx.letterSpacing = '14px';
            ctx.fillText('EXCHANGE  •  DISCOVER  •  READ', 1024, 1660);

            // Decorative Divider Line
            ctx.strokeStyle = '#e5b85c';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(600, 1780);
            ctx.lineTo(950, 1780);
            ctx.moveTo(1098, 1780);
            ctx.lineTo(1448, 1780);
            ctx.stroke();

            ctx.fillStyle = '#e5b85c';
            ctx.beginPath();
            ctx.arc(1024, 1780, 10, 0, Math.PI * 2);
            ctx.fill();

            // Footnote Title
            ctx.fillStyle = 'rgba(254, 241, 207, 0.85)';
            ctx.font = '500 44px "Plus Jakarta Sans", sans-serif';
            ctx.shadowBlur = 0;
            ctx.fillText('Online Book Exchange Platform', 1024, 2480);

            return new THREE.CanvasTexture(canvas);
        }

        function createInsideCoverTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 2880;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#140c06';
            ctx.fillRect(0, 0, 2048, 2880);

            ctx.strokeStyle = 'rgba(229, 184, 92, 0.22)';
            ctx.lineWidth = 3;
            for (let i = 0; i < 300; i++) {
                ctx.beginPath();
                ctx.arc(1024 + (Math.sin(i) * 700), i * 10, 160 + (i % 40), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(229, 184, 92, 0.4)';
            ctx.lineWidth = 5;
            ctx.strokeRect(160, 160, 1728, 2560);

            ctx.fillStyle = 'rgba(229, 184, 92, 0.9)';
            ctx.font = '700 64px "Cinzel", serif';
            ctx.textAlign = 'center';
            ctx.fillText('EX LIBRIS', 1024, 1200);

            ctx.font = '500 48px "Plus Jakarta Sans", sans-serif';
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText('This volume belongs to the shared world.', 1024, 1310);

            return new THREE.CanvasTexture(canvas);
        }

        function createGoldenBrownPageEdges() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Realistic Golden-Brown Gilded Page Block
            const grad = ctx.createLinearGradient(0, 0, 256, 1024);
            grad.addColorStop(0, '#e5b85c');
            grad.addColorStop(0.3, '#fef1cf');
            grad.addColorStop(0.7, '#b88228');
            grad.addColorStop(1, '#7a4e18');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 1024);

            // Visible Page Edge Striations
            ctx.fillStyle = 'rgba(40, 20, 8, 0.22)';
            for (let i = 0; i < 1024; i += 3) {
                ctx.fillRect(0, i, 256, 1.3);
            }
            return new THREE.CanvasTexture(canvas);
        }

        /* -------------------------------------------------------------
           3D SCENE SETUP & SCALED HERO BOOK (CLOSED BY DEFAULT)
        ------------------------------------------------------------- */
        let scene, camera, renderer;
        let bookGroup, coverPivot;
        let leftPageMesh, rightPageMesh;
        let activeFlippingSheet;
        let particlesMesh;
        let isBookOpen = false; // SHOW CLOSED INITIALLY AS REQUESTED
        let isFlipping = false;

        let currentSpreadIndex = 0;

        let isDragging = false;
        let pointerDownPos = { x: 0, y: 0 };
        let previousPointerPosition = { x: 0, y: 0 };
        let bookRotationVelocity = { x: 0, y: 0 };

        // Scaled book dimensions so it doesn't cover the entire screen:
        const bookScale = 0.82; // Comfortably sized hero element
        const defaultBookPos = { x: 0, y: 0.08, z: 0 };
        let targetCamZ = 4.9; // Clean perspective showing front cover, spine, page edges & bottom
        let targetCoverRot = 0; // Starts closed

        const raycaster = new THREE.Raycaster();
        const mouseVec = new THREE.Vector2();

        function init3D() {
            const canvas = document.getElementById('webgl-canvas');
            const width = window.innerWidth;
            const height = window.innerHeight;

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
            camera.position.set(0, 0.1, targetCamZ);
            camera.lookAt(0, 0.08, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.35;

            // Studio Lighting (Clean, warm, highlights the golden details)
            const ambientLight = new THREE.AmbientLight(0xffeedd, 1.4);
            scene.add(ambientLight);

            // Front key light pointing directly at front cover & centerpiece
            const keyLight = new THREE.DirectionalLight(0xfff8ee, 3.2);
            keyLight.position.set(2.5, 4.2, 5.0);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 1024;
            keyLight.shadow.mapSize.height = 1024;
            scene.add(keyLight);

            // Front-facing illumination for crystal-clear cover visibility
            const frontLight = new THREE.DirectionalLight(0xffffff, 2.0);
            frontLight.position.set(0, 1.2, 4.5);
            scene.add(frontLight);

            // Warm rim light highlighting leather edges & gold bands
            const rimLight = new THREE.DirectionalLight(0xe5b85c, 2.2);
            rimLight.position.set(-3.5, 2.0, 2.5);
            scene.add(rimLight);

            // Soft Floor Shadow Plane
            const shadowPlaneGeo = new THREE.PlaneGeometry(12, 12);
            const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.45 });
            const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
            shadowPlane.rotation.x = -Math.PI / 2;
            shadowPlane.position.y = -1.55;
            shadowPlane.receiveShadow = true;
            scene.add(shadowPlane);

            buildPhysicalCollectorBook();
            buildSubtleParticles();
            setupMouseInteraction();

            window.addEventListener('resize', onWindowResize);
        }

        /* -------------------------------------------------------------
           BUILD 3D PHYSICAL BOOK GEOMETRY (MATCHING REFERENCE IMAGE)
        ------------------------------------------------------------- */
        function buildPhysicalCollectorBook() {
            bookGroup = new THREE.Group();
            bookGroup.position.set(defaultBookPos.x, defaultBookPos.y, defaultBookPos.z);
            bookGroup.scale.set(bookScale, bookScale, bookScale);

            // Proportions matching the thick collector's hardcover reference:
            const bookWidth = 1.68;
            const bookHeight = 2.34;
            const bookDepth = 0.32; // Thick square-bound hardcover
            const coverThick = 0.042; // Thick front & bottom covers

            const coverExtMat = new THREE.MeshStandardMaterial({
                map: createCollectorHardcoverTexture(),
                roughness: 0.32,
                metalness: 0.25
            });

            const coverIntMat = new THREE.MeshStandardMaterial({
                map: createInsideCoverTexture(),
                roughness: 0.7,
                metalness: 0.05
            });

            const spineLeatherMat = new THREE.MeshStandardMaterial({
                color: 0x180f08,
                roughness: 0.38,
                metalness: 0.2
            });

            const goldenPageEdgesMat = new THREE.MeshStandardMaterial({
                map: createGoldenBrownPageEdges(),
                roughness: 0.35,
                metalness: 0.72
            });

            // 1. Thick Bottom Cover
            const backCoverGeo = new THREE.BoxGeometry(bookWidth, bookHeight, coverThick);
            const backCoverMesh = new THREE.Mesh(backCoverGeo, [
                spineLeatherMat, spineLeatherMat, spineLeatherMat, spineLeatherMat, coverIntMat, coverExtMat
            ]);
            backCoverMesh.position.set(bookWidth / 2, 0, -bookDepth / 2);
            backCoverMesh.castShadow = true;
            backCoverMesh.receiveShadow = true;
            bookGroup.add(backCoverMesh);

            // 2. Detailed Spine with Decorative Golden Bands
            const spineGeo = new THREE.CylinderGeometry(bookDepth / 2, bookDepth / 2, bookHeight, 24, 1, false, Math.PI / 2, Math.PI);
            const spineMesh = new THREE.Mesh(spineGeo, spineLeatherMat);
            spineMesh.rotation.y = Math.PI / 2;
            spineMesh.position.set(0, 0, 0);
            spineMesh.castShadow = true;
            bookGroup.add(spineMesh);

            // Add 5 Horizontal Raised Gold Bands on the Spine (Matching Collector's Edition)
            for (let b = -0.8; b <= 0.8; b += 0.4) {
                const bandGeo = new THREE.CylinderGeometry(bookDepth / 2 + 0.015, bookDepth / 2 + 0.015, 0.04, 24, 1, false, Math.PI / 2, Math.PI);
                const bandMat = new THREE.MeshStandardMaterial({ color: 0xe5b85c, metalness: 0.8, roughness: 0.3 });
                const bandMesh = new THREE.Mesh(bandGeo, bandMat);
                bandMesh.rotation.y = Math.PI / 2;
                bandMesh.position.set(0, b, 0);
                bookGroup.add(bandMesh);
            }

            // 3. Thick Front Cover Pivot (Hinged at x=0)
            coverPivot = new THREE.Group();
            coverPivot.position.set(0, 0, bookDepth / 2);

            const frontCoverGeo = new THREE.BoxGeometry(bookWidth, bookHeight, coverThick);
            const frontCoverMesh = new THREE.Mesh(frontCoverGeo, [
                spineLeatherMat, spineLeatherMat, spineLeatherMat, spineLeatherMat, coverExtMat, coverIntMat
            ]);
            frontCoverMesh.position.set(bookWidth / 2, 0, 0);
            frontCoverMesh.castShadow = true;
            frontCoverMesh.receiveShadow = true;
            coverPivot.add(frontCoverMesh);

            // Starts CLOSED:
            coverPivot.rotation.y = 0;
            bookGroup.add(coverPivot);

            // 4. Initial Spread Content (Spread 0)
            const initialSpread = getSpreadContent(0);

            const sheetWidth = bookWidth - 0.06;
            const sheetHeight = bookHeight - 0.08;
            const sheetDepth = 0.012;

            // 5. Right Page Mesh
            const rightPageGeo = new THREE.BoxGeometry(sheetWidth, sheetHeight, sheetDepth);
            const rightPageMat = new THREE.MeshStandardMaterial({
                map: renderRightPageCanvas(initialSpread.right),
                roughness: 0.98,
                metalness: 0.0
            });
            rightPageMesh = new THREE.Mesh(rightPageGeo, [
                goldenPageEdgesMat, goldenPageEdgesMat, goldenPageEdgesMat, goldenPageEdgesMat, rightPageMat, goldenPageEdgesMat
            ]);
            rightPageMesh.position.set(sheetWidth / 2 + 0.02, 0, 0.02);
            rightPageMesh.castShadow = true;
            rightPageMesh.receiveShadow = true;
            bookGroup.add(rightPageMesh);

            // 6. Left Page Mesh (Hidden while closed, reveals when opened)
            const leftPageGeo = new THREE.BoxGeometry(sheetWidth, sheetHeight, sheetDepth);
            const leftPageMat = new THREE.MeshStandardMaterial({
                map: renderLeftPageCanvas(initialSpread.left),
                roughness: 0.98,
                metalness: 0.0
            });
            leftPageMesh = new THREE.Mesh(leftPageGeo, [
                goldenPageEdgesMat, goldenPageEdgesMat, goldenPageEdgesMat, goldenPageEdgesMat, leftPageMat, goldenPageEdgesMat
            ]);
            leftPageMesh.position.set(-sheetWidth / 2 - 0.02, 0, 0.02);
            leftPageMesh.castShadow = true;
            leftPageMesh.receiveShadow = true;
            leftPageMesh.visible = false;
            bookGroup.add(leftPageMesh);

            // 7. Dynamic Turning Sheet
            const flipPivot = new THREE.Group();
            flipPivot.position.set(0.01, 0, 0.04);

            const flipGeo = new THREE.BoxGeometry(sheetWidth, sheetHeight, 0.006);
            const flipFrontMat = new THREE.MeshStandardMaterial({ map: renderRightPageCanvas(initialSpread.right), roughness: 0.98, metalness: 0.0 });
            const flipBackMat = new THREE.MeshStandardMaterial({ map: renderLeftPageCanvas(initialSpread.left), roughness: 0.98, metalness: 0.0 });

            const flipMesh = new THREE.Mesh(flipGeo, [
                goldenPageEdgesMat, goldenPageEdgesMat, goldenPageEdgesMat, goldenPageEdgesMat, flipFrontMat, flipBackMat
            ]);
            flipMesh.position.set(sheetWidth / 2, 0, 0);
            flipMesh.castShadow = true;
            flipPivot.add(flipMesh);
            flipPivot.visible = false;

            bookGroup.add(flipPivot);
            activeFlippingSheet = {
                pivot: flipPivot,
                mesh: flipMesh,
                frontMat: flipFrontMat,
                backMat: flipBackMat
            };

            // INITIAL PERSPECTIVE ANGLE (Matching reference image: front cover, spine, golden edges & bottom cover all visible):
            bookGroup.rotation.set(0.24, -0.45, -0.06);
            scene.add(bookGroup);
        }

        /* -------------------------------------------------------------
           SUBTLE FLOATING DUST PARTICLES
        ------------------------------------------------------------- */
        function buildSubtleParticles() {
            const count = 90;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 6;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 4 + 0.2;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 4;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const pCanvas = document.createElement('canvas');
            pCanvas.width = 64;
            pCanvas.height = 64;
            const pCtx = pCanvas.getContext('2d');
            const pGrad = pCtx.createRadialGradient(32, 32, 0, 32, 32, 30);
            pGrad.addColorStop(0, 'rgba(245, 215, 140, 0.8)');
            pGrad.addColorStop(0.5, 'rgba(200, 140, 60, 0.35)');
            pGrad.addColorStop(1, 'transparent');
            pCtx.fillStyle = pGrad;
            pCtx.beginPath();
            pCtx.arc(32, 32, 30, 0, Math.PI * 2);
            pCtx.fill();

            const pMat = new THREE.PointsMaterial({
                size: 0.08,
                map: new THREE.CanvasTexture(pCanvas),
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particlesMesh = new THREE.Points(geo, pMat);
            scene.add(particlesMesh);
        }

        /* -------------------------------------------------------------
           INTERACTION: ROTATION, OPENING & PAGE TURNING
        ------------------------------------------------------------- */
        let targetBookRot = { x: 0.24, y: -0.45, z: -0.06 };
        let isAligningToTarget = true;

        function setupMouseInteraction() {
            const canvas = document.getElementById('webgl-canvas');

            const onPointerDown = (clientX, clientY) => {
                isDragging = true;
                isAligningToTarget = false;
                pointerDownPos = { x: clientX, y: clientY };
                previousPointerPosition = { x: clientX, y: clientY };
            };

            const onPointerMove = (clientX, clientY) => {
                mouseVec.x = (clientX / window.innerWidth) * 2 - 1;
                mouseVec.y = -(clientY / window.innerHeight) * 2 + 1;

                if (!isDragging) return;
                const deltaX = clientX - previousPointerPosition.x;
                const deltaY = clientY - previousPointerPosition.y;

                // Rotate book with smooth physical inertia
                bookGroup.rotation.y += deltaX * 0.007;
                bookGroup.rotation.x += deltaY * 0.007;
                bookGroup.rotation.x = Math.max(-0.6, Math.min(0.6, bookGroup.rotation.x));

                bookRotationVelocity.x = deltaX * 0.003;
                bookRotationVelocity.y = deltaY * 0.003;

                previousPointerPosition = { x: clientX, y: clientY };
            };

            const onPointerUp = (clientX, clientY) => {
                isDragging = false;
                const distMoved = Math.hypot(clientX - pointerDownPos.x, clientY - pointerDownPos.y);

                if (distMoved < 14) {
                    handleBookClick();
                }
            };

            canvas.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', (e) => onPointerUp(e.clientX, e.clientY));

            // Double click anywhere on canvas closes the book when open
            canvas.addEventListener('dblclick', () => {
                if (isBookOpen) closeBook();
            });

            // Mobile Touch Events
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1) onPointerUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            });
        }

        function handleBookClick() {
            if (isFlipping) return;

            raycaster.setFromCamera(mouseVec, camera);
            const intersects = raycaster.intersectObjects(bookGroup.children, true);

            if (intersects.length === 0) return;

            const hit = intersects[0];
            const localPoint = bookGroup.worldToLocal(hit.point.clone());

            // 1. If book is closed -> Click anywhere opens it!
            if (!isBookOpen) {
                openBook();
                return;
            }

            // 2. If book is open:
            if (localPoint.x > 0.12) {
                // Clicked RIGHT PAGE -> Turn next spread forward (Unlimited!)
                turnSpreadForward();
            } else if (localPoint.x < -0.12) {
                // Clicked LEFT PAGE -> If at chapter 1, close book immediately! If later chapter, turn back
                if (currentSpreadIndex === 0) {
                    closeBook();
                } else {
                    turnSpreadBackward();
                }
            } else {
                // Clicked Center Spine or Hinge Area -> Close book smoothly!
                closeBook();
            }
        }

        /* -------------------------------------------------------------
           SMOOTH MOTION CONTROLLERS FOR BOOK OPENING & CLOSING
        ------------------------------------------------------------- */
        function openBook() {
            if (isBookOpen || isFlipping) return;
            isBookOpen = true;
            isAligningToTarget = true;
            targetCoverRot = -Math.PI * 0.94; // Rotates naturally around the spine
            targetCamZ = (window.innerWidth < 900 ? 4.2 : 3.65); // Zoom closer for large, bold, crystal-clear reading
            targetBookRot = { x: 0.06, y: 0, z: 0 };
            bookRotationVelocity = { x: 0, y: 0 };

            currentSpreadIndex = 0;
            const currentSpread = getSpreadContent(0);

            leftPageMesh.material[4].map = renderLeftPageCanvas(currentSpread.left);
            leftPageMesh.material[4].needsUpdate = true;
            leftPageMesh.visible = true;

            rightPageMesh.material[4].map = renderRightPageCanvas(currentSpread.right);
            rightPageMesh.material[4].needsUpdate = true;

            const closeBtn = document.getElementById('book-close-trigger');
            if (closeBtn) closeBtn.classList.add('visible');

            showToast('Book opened. Click right page to turn forward, left page or spine to close.');
        }

        function closeBook() {
            if (!isBookOpen || isFlipping) return;
            isBookOpen = false;
            isAligningToTarget = true;
            targetCoverRot = 0;
            targetCamZ = (window.innerWidth < 900 ? 5.2 : 4.9);
            targetBookRot = { x: 0.24, y: -0.45, z: -0.06 };
            bookRotationVelocity = { x: 0, y: 0 };
            currentSpreadIndex = 0;

            const closeBtn = document.getElementById('book-close-trigger');
            if (closeBtn) closeBtn.classList.remove('visible');

            showToast('Book closed. Click book to reopen.');
        }

        // TURN SPREAD FORWARD (UNLIMITED)
        function turnSpreadForward() {
            if (isFlipping) return;
            isFlipping = true;

            const nextSpreadIndex = currentSpreadIndex + 1;
            const currentSpread = getSpreadContent(currentSpreadIndex);
            const nextSpread = getSpreadContent(nextSpreadIndex);

            activeFlippingSheet.frontMat.map = renderRightPageCanvas(currentSpread.right);
            activeFlippingSheet.frontMat.needsUpdate = true;
            activeFlippingSheet.backMat.map = renderLeftPageCanvas(nextSpread.left);
            activeFlippingSheet.backMat.needsUpdate = true;

            rightPageMesh.material[4].map = renderRightPageCanvas(nextSpread.right);
            rightPageMesh.material[4].needsUpdate = true;

            activeFlippingSheet.pivot.visible = true;
            const targetRot = -Math.PI * 0.94;

            const startTime = performance.now();
            const duration = 650;

            function animateFlip(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / duration);
                const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                activeFlippingSheet.pivot.rotation.y = ease * targetRot;
                activeFlippingSheet.pivot.rotation.z = Math.sin(progress * Math.PI) * 0.08;

                if (progress < 1) {
                    requestAnimationFrame(animateFlip);
                } else {
                    currentSpreadIndex = nextSpreadIndex;

                    leftPageMesh.material[4].map = renderLeftPageCanvas(nextSpread.left);
                    leftPageMesh.material[4].needsUpdate = true;

                    activeFlippingSheet.pivot.visible = false;
                    activeFlippingSheet.pivot.rotation.y = 0;
                    activeFlippingSheet.pivot.rotation.z = 0;
                    isFlipping = false;

                    showToast(`Turned to Chapter ${nextSpread.chapterNumber}`);
                }
            }

            requestAnimationFrame(animateFlip);
        }

        // TURN SPREAD BACKWARD (UNLIMITED)
        function turnSpreadBackward() {
            if (isFlipping) return;

            if (currentSpreadIndex === 0) {
                closeBook();
                return;
            }

            isFlipping = true;

            const prevSpreadIndex = currentSpreadIndex - 1;
            const currentSpread = getSpreadContent(currentSpreadIndex);
            const prevSpread = getSpreadContent(prevSpreadIndex);

            activeFlippingSheet.frontMat.map = renderRightPageCanvas(prevSpread.right);
            activeFlippingSheet.frontMat.needsUpdate = true;
            activeFlippingSheet.backMat.map = renderLeftPageCanvas(currentSpread.left);
            activeFlippingSheet.backMat.needsUpdate = true;

            leftPageMesh.material[4].map = renderLeftPageCanvas(prevSpread.left);
            leftPageMesh.material[4].needsUpdate = true;

            activeFlippingSheet.pivot.visible = true;
            const startRot = -Math.PI * 0.94;
            const targetRot = 0;

            const startTime = performance.now();
            const duration = 650;

            function animateBack(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / duration);
                const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                activeFlippingSheet.pivot.rotation.y = startRot + (ease * (targetRot - startRot));
                activeFlippingSheet.pivot.rotation.z = -Math.sin(progress * Math.PI) * 0.08;

                if (progress < 1) {
                    requestAnimationFrame(animateBack);
                } else {
                    currentSpreadIndex = prevSpreadIndex;

                    rightPageMesh.material[4].map = renderRightPageCanvas(prevSpread.right);
                    rightPageMesh.material[4].needsUpdate = true;

                    activeFlippingSheet.pivot.visible = false;
                    activeFlippingSheet.pivot.rotation.y = 0;
                    activeFlippingSheet.pivot.rotation.z = 0;
                    isFlipping = false;

                    showToast(`Returned to Chapter ${prevSpread.chapterNumber}`);
                }
            }

            requestAnimationFrame(animateBack);
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            if (width < 900) {
                bookGroup.position.set(0, 0.06, 0);
                targetCamZ = isBookOpen ? 4.2 : 5.2;
            } else {
                bookGroup.position.set(defaultBookPos.x, defaultBookPos.y, defaultBookPos.z);
                targetCamZ = isBookOpen ? 3.65 : 4.9;
            }
        }

        /* -------------------------------------------------------------
           CONTINUOUS RENDER & FLOATING PHYSICS LOOP
        ------------------------------------------------------------- */
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            // Smooth Cover opening/closing
            coverPivot.rotation.y += (targetCoverRot - coverPivot.rotation.y) * 0.12;

            // Only hide left page mesh once cover is nearly shut
            if (!isBookOpen && Math.abs(coverPivot.rotation.y) < 0.15) {
                leftPageMesh.visible = false;
            }

            // Camera smooth zoom
            camera.position.z += (targetCamZ - camera.position.z) * 0.08;

            // Gentle floating in place & smooth rotation orientation
            if (!isDragging) {
                if (isAligningToTarget) {
                    bookGroup.rotation.x += (targetBookRot.x - bookGroup.rotation.x) * 0.09;
                    bookGroup.rotation.y += (targetBookRot.y - bookGroup.rotation.y) * 0.09;
                    bookGroup.rotation.z += (targetBookRot.z - bookGroup.rotation.z) * 0.09;
                    if (Math.abs(bookGroup.rotation.y - targetBookRot.y) < 0.005) {
                        isAligningToTarget = false;
                    }
                }
                const targetY = (window.innerWidth < 900 ? 0.06 : defaultBookPos.y) + Math.sin(elapsed * 1.5) * 0.02;
                bookGroup.position.y += (targetY - bookGroup.position.y) * 0.08;

                bookGroup.rotation.y += bookRotationVelocity.x;
                bookGroup.rotation.x += bookRotationVelocity.y;
                bookRotationVelocity.x *= 0.94;
                bookRotationVelocity.y *= 0.94;
            }

            // Animate subtle floating dust particles
            if (particlesMesh) {
                const pos = particlesMesh.geometry.attributes.position.array;
                for (let i = 0; i < pos.length; i += 3) {
                    pos[i + 1] += Math.sin(elapsed + pos[i]) * 0.002;
                    pos[i] += Math.cos(elapsed * 0.5 + pos[i + 2]) * 0.0015;
                }
                particlesMesh.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        /* -------------------------------------------------------------
           AUTHENTICATION MODALS (LOGIN & SIGN UP ONLY)
        ------------------------------------------------------------- */
        const loginModal = document.getElementById('login-modal');
        const signupModal = document.getElementById('signup-modal');
        const openLoginBtn = document.getElementById('open-login-btn');
        const openSignupBtn = document.getElementById('open-signup-btn');
        const switchToSignup = document.getElementById('switch-to-signup');
        const switchToLogin = document.getElementById('switch-to-login');
        const closeButtons = document.querySelectorAll('[data-close]');
        const bookCloseTrigger = document.getElementById('book-close-trigger');

        if (bookCloseTrigger) {
            bookCloseTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                closeBook();
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (loginModal && loginModal.classList.contains('active')) closeModal(loginModal);
                else if (signupModal && signupModal.classList.contains('active')) closeModal(signupModal);
                else if (isBookOpen) closeBook();
            }
        });

        function openModal(modal) {
            modal.classList.add('active');
        }

        function closeModal(modal) {
            modal.classList.remove('active');
        }

        openLoginBtn.addEventListener('click', () => openModal(loginModal));
        openSignupBtn.addEventListener('click', () => openModal(signupModal));

        switchToSignup.addEventListener('click', () => {
            closeModal(loginModal);
            setTimeout(() => openModal(signupModal), 200);
        });

        switchToLogin.addEventListener('click', () => {
            closeModal(signupModal);
            setTimeout(() => openModal(loginModal), 200);
        });

        closeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-close');
                closeModal(document.getElementById(targetId));
            });
        });

        [loginModal, signupModal].forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal(modal);
                }
            });
        });

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = message;
            toast.classList.add('active');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.classList.remove('active');
            }, 2800);
        }

        // REAL AUTHENTICATION HANDLERS
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-submit-btn');
        const loginErrorMsg = document.getElementById('login-error-msg');

        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginErrorMsg.style.display = 'none';
                loginErrorMsg.innerText = '';

                const identifier = document.getElementById('login-identifier').value.trim();
                const password = document.getElementById('login-pwd-input').value.trim();

                if (!identifier || !password) {
                    loginErrorMsg.innerText = 'Please enter both your email/username and password.';
                    loginErrorMsg.style.display = 'block';
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.innerText = 'Authenticating...';

                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ username: identifier, password: password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        localStorage.setItem('isAuthenticated', 'true');
                        localStorage.setItem('userId', data.id);
                        localStorage.setItem('username', data.username);
                        if (data.email) localStorage.setItem('email', data.email);
                        if (data.mobile) localStorage.setItem('mobile', data.mobile);

                        showToast(`Welcome back, ${data.username}!`);
                        setTimeout(() => {
                            if (window.parent && window.parent !== window) {
                                window.parent.postMessage({ type: 'AUTH_SUCCESS', user: data }, '*');
                            }
                            window.location.href = '/';
                        }, 800);
                    } else {
                        loginErrorMsg.innerText = data.error || 'Invalid username or password. Please try again.';
                        loginErrorMsg.style.display = 'block';
                    }
                } catch (err) {
                    console.error('Login error:', err);
                    loginErrorMsg.innerText = 'Unable to reach backend server. Please verify port 5000 is running.';
                    loginErrorMsg.style.display = 'block';
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'Login →';
                }
            });
        }

        const signupForm = document.getElementById('signup-form');
        const signupBtn = document.getElementById('signup-submit-btn');
        const signupErrorMsg = document.getElementById('signup-error-msg');

        if (signupForm) {
            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                signupErrorMsg.style.display = 'none';
                signupErrorMsg.innerText = '';

                const fullName = document.getElementById('signup-fullname').value.trim();
                const email = document.getElementById('signup-email').value.trim();
                const mobile = document.getElementById('signup-mobile').value.trim();
                const password = document.getElementById('signup-pwd-input').value.trim();
                const confirmPassword = document.getElementById('signup-cpwd-input').value.trim();

                if (!fullName || !email || !mobile || !password || !confirmPassword) {
                    signupErrorMsg.innerText = 'Please fill in all required fields.';
                    signupErrorMsg.style.display = 'block';
                    return;
                }
                if (fullName.length < 3) {
                    signupErrorMsg.innerText = 'Full Name must be at least 3 characters long.';
                    signupErrorMsg.style.display = 'block';
                    return;
                }
                const cleanedMobile = mobile.replace(/\D/g, '');
                if (cleanedMobile.length !== 10) {
                    signupErrorMsg.innerText = 'Please enter a valid 10-digit mobile number.';
                    signupErrorMsg.style.display = 'block';
                    return;
                }
                if (password.length < 4) {
                    signupErrorMsg.innerText = 'Password must be at least 4 characters long.';
                    signupErrorMsg.style.display = 'block';
                    return;
                }
                if (password !== confirmPassword) {
                    signupErrorMsg.innerText = 'Passwords do not match.';
                    signupErrorMsg.style.display = 'block';
                    return;
                }

                signupBtn.disabled = true;
                signupBtn.innerText = 'Creating Account...';

                try {
                    const res = await fetch('/api/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({
                            username: fullName,
                            email: email,
                            mobile: cleanedMobile,
                            password: password
                        })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        localStorage.setItem('isAuthenticated', 'true');
                        localStorage.setItem('userId', data.id);
                        localStorage.setItem('username', data.username);
                        if (data.email) localStorage.setItem('email', data.email);
                        if (data.mobile) localStorage.setItem('mobile', data.mobile);

                        showToast(`Account created! Welcome, ${data.username}`);
                        setTimeout(() => {
                            if (window.parent && window.parent !== window) {
                                window.parent.postMessage({ type: 'AUTH_SUCCESS', user: data }, '*');
                            }
                            window.location.href = '/';
                        }, 800);
                    } else {
                        signupErrorMsg.innerText = data.error || 'Signup failed. Please try again.';
                        signupErrorMsg.style.display = 'block';
                    }
                } catch (err) {
                    console.error('Signup error:', err);
                    signupErrorMsg.innerText = 'Unable to reach backend server. Please verify port 5000 is running.';
                    signupErrorMsg.style.display = 'block';
                } finally {
                    signupBtn.disabled = false;
                    signupBtn.innerText = 'Create Account →';
                }
            });
        }

        function startApp() {
            try {
                if (typeof THREE === 'undefined') {
                    console.warn('Waiting for Three.js to finish loading...');
                    setTimeout(startApp, 50);
                    return;
                }
                init3D();
                animate();
                onWindowResize();
                console.log('BookBridge 3D Book initialized successfully.');
            } catch (err) {
                console.error('Error starting 3D Book experience:', err);
            }
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            startApp();
        } else {
            window.addEventListener('DOMContentLoaded', startApp);
            window.addEventListener('load', startApp);
        }
    </script>
</body>
</html>
