<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookBridge - Online Book Exchange Platform | 3D Interactive Collector's Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-primary: #e5b85c;
            --gold-light: #fef1cf;
            --gold-dark: #a67324;
            --leather-dark: #1b120c;
            --bg-deep: #070911;
            --card-glass: rgba(14, 18, 32, 0.85);
            --card-border: rgba(229, 184, 92, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: 
                radial-gradient(circle at 50% 48%, rgba(28, 38, 66, 0.45) 0%, rgba(12, 17, 30, 0.7) 50%, transparent 80%),
                radial-gradient(circle at 50% 95%, rgba(5, 7, 14, 0.95) 0%, transparent 85%),
                linear-gradient(180deg, #070a12 0%, #030408 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
        }

        /* 3D WebGL Canvas */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            cursor: grab;
            display: block;
        }

        #webgl-canvas:active {
            cursor: grabbing;
        }

        /* Clean Studio Vignette (Pure Inset Shadow - completely transparent center) */
        .studio-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 3;
            box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.75);
        }

        /* Header: Strictly BookBridge - Online Book Exchange Platform */
        .header-container {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            animation: fadeInDown 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .header-title {
            font-family: 'Cinzel', serif;
            font-size: 2.7rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 15%, var(--gold-light) 60%, var(--gold-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 28px rgba(0, 0, 0, 0.85);
            margin-bottom: 3px;
        }

        .header-subtitle {
            font-size: 0.94rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--gold-primary);
            text-transform: uppercase;
            opacity: 0.95;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        /* ONLY TWO BUTTONS: LOGIN AND SIGN UP */
        .auth-actions-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 22px;
            animation: fadeInUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .auth-pill-btn {
            min-width: 155px;
            padding: 13px 35px;
            font-family: 'Cinzel', serif;
            font-size: 0.94rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .auth-pill-btn.primary {
            background: linear-gradient(135deg, #e5b85c 0%, #b88228 100%);
            color: #080a12;
            border: none;
            box-shadow: 0 8px 25px rgba(229, 184, 92, 0.35);
        }

        .auth-pill-btn.primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 35px rgba(229, 184, 92, 0.55);
        }

        .auth-pill-btn.secondary {
            background: rgba(14, 19, 36, 0.75);
            color: var(--gold-light);
            border: 1.5px solid rgba(229, 184, 92, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
        }

        .auth-pill-btn.secondary:hover {
            transform: translateY(-3px) scale(1.03);
            border-color: var(--gold-primary);
            background: rgba(229, 184, 92, 0.16);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
        }

        /* Floating Close Book Button (Appears when Book is Open) */
        .book-close-trigger {
            position: fixed;
            top: 28px;
            right: 32px;
            z-index: 30;
            background: rgba(14, 18, 32, 0.88);
            border: 1.5px solid rgba(229, 184, 92, 0.55);
            color: var(--gold-light);
            font-family: 'Cinzel', serif;
            font-size: 0.84rem;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 9px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .book-close-trigger.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .book-close-trigger:hover {
            background: rgba(229, 184, 92, 0.24);
            border-color: var(--gold-primary);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 12px 32px rgba(229, 184, 92, 0.35);
        }

        /* Glassmorphism Modals Overlay */
        .auth-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 4, 8, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 6%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease, backdrop-filter 0.35s ease;
        }

        .auth-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Glassmorphism Modal Card */
        .auth-card {
            width: 100%;
            max-width: 390px;
            background: var(--card-glass);
            border: 1.5px solid var(--card-border);
            border-radius: 22px;
            padding: 32px 28px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.9), 0 0 35px rgba(229, 184, 92, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            transform: translateX(40px) scale(0.96);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
            position: relative;
        }

        .auth-modal-overlay.active .auth-card {
            transform: translateX(0) scale(1);
        }

        /* Close Button */
        .close-modal-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-modal-btn:hover {
            background: rgba(229, 184, 92, 0.2);
            border-color: var(--gold-primary);
            color: #ffffff;
            transform: rotate(90deg);
        }

        .card-emblem {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(229, 184, 92, 0.25) 0%, rgba(14, 18, 32, 0.1) 70%);
            border: 1.5px solid var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(229, 184, 92, 0.3);
        }

        .card-emblem svg {
            width: 24px;
            height: 24px;
            fill: var(--gold-primary);
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.65rem;
            font-weight: 700;
            text-align: center;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box-wrapper svg {
            position: absolute;
            left: 14px;
            width: 17px;
            height: 17px;
            fill: var(--text-muted);
            pointer-events: none;
            transition: fill 0.25s ease;
        }

        .form-input {
            width: 100%;
            height: 44px;
            padding: 0 40px 0 40px;
            background: rgba(8, 11, 22, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input:focus {
            border-color: var(--gold-primary);
            background: rgba(13, 18, 36, 0.98);
            box-shadow: 0 0 16px rgba(229, 184, 92, 0.3);
        }

        .toggle-pwd-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .toggle-pwd-btn:hover {
            color: var(--gold-primary);
        }

        .form-row-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 18px;
            font-size: 0.78rem;
        }

        .link-text {
            color: var(--gold-primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .link-text:hover {
            color: var(--gold-light);
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            height: 44px;
            background: linear-gradient(135deg, #e5b85c 0%, #b88228 100%);
            border: none;
            border-radius: 12px;
            color: #080a12;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(229, 184, 92, 0.3);
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(229, 184, 92, 0.5);
            filter: brightness(1.06);
        }

        .switch-prompt {
            text-align: center;
            margin-top: 16px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .switch-prompt a {
            color: var(--gold-primary);
            font-weight: 600;
            text-decoration: none;
            margin-left: 5px;
            cursor: pointer;
        }

        .switch-prompt a:hover {
            text-decoration: underline;
        }

        /* Subtle Feedback Toast */
        .toast-notification {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            padding: 12px 24px;
            border-radius: 14px;
            background: rgba(14, 18, 32, 0.95);
            border: 1px solid var(--gold-primary);
            color: #ffffff;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.85);
            transform: translateY(-30px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .toast-notification.active {
            transform: translateY(0);
            opacity: 1;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        @media (max-width: 900px) {
            .auth-modal-overlay {
                justify-content: center;
                padding-right: 0;
                padding: 20px;
            }
            .header-title {
                font-size: 1.8rem;
                letter-spacing: 3px;
            }
            .header-subtitle {
                font-size: 0.82rem;
            }
            .auth-actions-bar {
                bottom: 24px;
                gap: 14px;
            }
            .auth-pill-btn {
                min-width: 135px;
                padding: 11px 22px;
                font-size: 0.84rem;
            }
        }
    </style>
</head>
<body>

    <!-- 3D Canvas (z-index: 2, directly visible) -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Studio Vignette (z-index: 3, transparent center) -->
    <div class="studio-vignette"></div>

    <!-- Header: Strictly BookBridge - Online Book Exchange Platform -->
    <header class="header-container">
        <h1 class="header-title">BookBridge</h1>
        <p class="header-subtitle">Online Book Exchange Platform</p>
    </header>

    <!-- Floating Close Book Trigger -->
    <button id="book-close-trigger" class="book-close-trigger" aria-label="Close Book">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        <span>CLOSE BOOK</span>
    </button>

    <!-- ONLY TWO BUTTONS: LOGIN AND SIGN UP -->
    <div class="auth-actions-bar">
        <button id="open-login-btn" class="auth-pill-btn primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
            </svg>
            Login
        </button>
        <button id="open-signup-btn" class="auth-pill-btn secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            Sign Up
        </button>
    </div>

    <!-- Glassmorphic Login Modal -->
    <div id="login-modal" class="auth-modal-overlay">
        <div class="auth-card">
            <button class="close-modal-btn" data-close="login-modal">✕</button>
            <div class="card-emblem">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4.5C7 3 2.5 4.5 2 5v13.5c.5-.5 5-2 10-.5 5-1.5 9.5 0 10 .5V5c-.5-.5-5-2-10-.5zm-1 12c-4-1-7.5-.5-8 0V6.5c.5-.5 4-1 8 0v10zm10 0c-.5-.5-4-1-8 0V6.5c4-1 7.5-.5 8 0v10z"/>
                </svg>
            </div>
            <h2 class="card-title">Welcome Back</h2>
            <p class="card-subtitle">Open a new chapter and continue your journey.</p>
            
            <form id="login-form">
                <div id="login-error-msg" style="color: #f87171; font-size: 0.84rem; margin-bottom: 14px; display: none; padding: 10px 14px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 10px;"></div>

                <div class="form-group">
                    <label class="form-label">Email or Username</label>
                    <div class="input-box-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <input type="text" id="login-identifier" class="form-input" placeholder="Enter your email or username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-box-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        <input id="login-pwd-input" type="password" class="form-input" placeholder="Enter your password" required>
                        <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('login-pwd-input')">👁</button>
                    </div>
                </div>

                <div class="form-row-actions">
                    <a href="#" class="link-text" onclick="showToast('Password reset link sent to your registered email.'); return false;">Forgot Password?</a>
                </div>

                <button type="submit" id="login-submit-btn" class="submit-btn">Login →</button>

                <p class="switch-prompt">
                    Don't have an account? <a id="switch-to-signup">Sign Up</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Glassmorphic Signup Modal -->
    <div id="signup-modal" class="auth-modal-overlay">
        <div class="auth-card">
            <button class="close-modal-btn" data-close="signup-modal">✕</button>
            <div class="card-emblem">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4.5C7 3 2.5 4.5 2 5v13.5c.5-.5 5-2 10-.5 5-1.5 9.5 0 10 .5V5c-.5-.5-5-2-10-.5zm-1 12c-4-1-7.5-.5-8 0V6.5c.5-.5 4-1 8 0v10zm10 0c-.5-.5-4-1-8 0V6.5c4-1 7.5-.5 8 0v10z"/>
                </svg>
            </div>
            <h2 class="card-title">Create Account</h2>
            <p class="card-subtitle">Your next reading adventure starts here.</p>
            
            <form id="signup-form">
                <div id="signup-error-msg" style="color: #f87171; font-size: 0.84rem; margin-bottom: 14px; display: none; padding: 10px 14px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 10px;"></div>

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <div class="input-box-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        <input type="text" id="signup-fullname" class="form-input" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="input-box-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <input type="email" id="signup-email" class="form-input" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Mobile Number</label>
                    <div class="input-box-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                        <input type="tel" id="signup-mobile" class="form-input" placeholder="Enter 10-digit mobile number" maxlength="10" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-box-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        <input id="signup-pwd-input" type="password" class="form-input" placeholder="Create password" required>
                        <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('signup-pwd-input')">👁</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-box-wrapper">

        function getSpreadContent(spreadIndex) {
            const baseIndex = spreadIndex % BOOK_SPREADS.length;
            const cycle = Math.floor(spreadIndex / BOOK_SPREADS.length);
            const base = BOOK_SPREADS[baseIndex];

            const leftPageNum = (spreadIndex * 2) + 1;
            const rightPageNum = (spreadIndex * 2) + 2;

            if (cycle === 0) {
                return {
                    ...base,
                    left: { ...base.left, pageNumber: leftPageNum },
                    right: { ...base.right, pageNumber: rightPageNum }
                };
            }

            return {
                chapterNumber: spreadIndex + 1,
                left: {
                    heading: `COLLECTION VOL. ${cycle + 1}`,
                    sub: `MANUSCRIPT FOLIO ${spreadIndex + 1}`,
                    pictureType: base.left.pictureType,

                    lead: base.right.lead,

                    pageNumber: rightPageNum

            };
        }

        /* -------------------------------------------------------------
           MODERN EDITORIAL ART CARDS (HIGH RESOLUTION & CRISP)
        ------------------------------------------------------------- */
        function drawEditorialArtwork(ctx, type, cx, cy, w, h) {
            ctx.save();
            ctx.translate(cx, cy);

            const cardW = w;
            const cardH = h;
            const radius = 20;

            // Background card container
            ctx.fillStyle = '#111827';
            ctx.beginPath();
            ctx.roundRect(-cardW/2, -cardH/2, cardW, cardH, radius);
            ctx.fill();

            // Elegant gold trim border
            ctx.strokeStyle = '#e5b85c';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(-cardW/2 + 10, -cardH/2 + 10, cardW - 20, cardH - 20, radius - 6);
            ctx.stroke();

            if (type === 'reading') {
                // Open Book with Architectural Arches
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-cardW/2 + 12, -cardH/2 + 12, cardW - 24, cardH - 24);

                // Minimalist open book
                ctx.strokeStyle = '#e5b85c';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(0, 140);
                ctx.bezierCurveTo(120, 60, 260, 120, 300, 130);
                ctx.lineTo(300, -80);
                ctx.bezierCurveTo(260, -90, 120, -150, 0, -80);
                ctx.bezierCurveTo(-120, -150, -260, -90, -300, -80);
                ctx.lineTo(-300, 130);
                ctx.bezierCurveTo(-260, 120, -120, 60, 0, 140);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -80);
                ctx.lineTo(0, 140);
                ctx.stroke();

                // Subtle radiating lines
                ctx.strokeStyle = 'rgba(229, 184, 92, 0.4)';
                ctx.lineWidth = 3;
                for (let a = -0.8; a <= 0.8; a += 0.4) {
                    ctx.beginPath();
                    ctx.moveTo(Math.sin(a) * 40, -100 - Math.cos(a) * 40);
                    ctx.lineTo(Math.sin(a) * 160, -100 - Math.cos(a) * 160);
                    ctx.stroke();
                }
            } else if (type === 'coffee') {
                // Stack of volumes
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-cardW/2 + 12, -cardH/2 + 12, cardW - 24, cardH - 24);

                ctx.fillStyle = '#334155';
                ctx.fillRect(-220, 60, 440, 50);
                ctx.fillStyle = '#e5b85c';
                ctx.fillRect(-220, 60, 40, 50);

                ctx.fillStyle = '#475569';
                ctx.fillRect(-200, 0, 400, 50);
                ctx.fillStyle = '#d97706';
                ctx.fillRect(-200, 0, 40, 50);

                ctx.fillStyle = '#64748b';
                ctx.fillRect(-180, -60, 360, 50);
                ctx.fillStyle = '#fde68a';
                ctx.fillRect(-180, -60, 40, 50);
            } else {
                // Sleek Bookshelf Row
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-cardW/2 + 12, -cardH/2 + 12, cardW - 24, cardH - 24);

                ctx.fillStyle = '#e5b85c';
                ctx.fillRect(-280, 80, 560, 16);

                const colors = ['#38bdf8', '#fbbf24', '#a855f7', '#34d399', '#f87171', '#60a5fa'];
                let bx = -250;
                for (let i = 0; i < 7; i++) {
                    const bw = 55;
                    const bh = 180 + (Math.sin(i) * 30);
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.fillRect(bx, 80 - bh, bw, bh);

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.fillRect(bx + 8, 80 - bh + 25, bw - 16, 40);

                    bx += 72;
                }
            }

            ctx.restore();
        }

        /* -------------------------------------------------------------

        function createHighResPageTexture(canvas) {
            const tex = new THREE.CanvasTexture(canvas);
            tex.generateMipmaps = false; // Prevents texture downscaling / mipmap blur!
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.needsUpdate = true;
            return tex;
        }

        function renderLeftPageCanvas(leftData) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 2880;
            const ctx = canvas.getContext('2d');

            // High-Contrast Clean Ivory/Parchment Paper
            const pageGrad = ctx.createLinearGradient(0, 0, 2048, 2880);
            pageGrad.addColorStop(0, '#ffffff');
            pageGrad.addColorStop(0.4, '#faf7f0');
            pageGrad.addColorStop(1, '#f4eee2');
            ctx.fillStyle = pageGrad;
            ctx.fillRect(0, 0, 2048, 2880);

            // Subtle Spine Crease Shadow
            const spineShadow = ctx.createLinearGradient(2048, 0, 1920, 0);
            spineShadow.addColorStop(0, 'rgba(0, 0, 0, 0.16)');
            spineShadow.addColorStop(1, 'transparent');
            ctx.fillStyle = spineShadow;
            ctx.fillRect(1920, 0, 128, 2880);

            // Double Frame in Pure Solid Black
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 6;
            ctx.strokeRect(100, 100, 1848, 2680);

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(122, 122, 1804, 2636);

            // Top Header: DEEP HEAVY BLACK ANCIENT ANTIQUE FONT
            ctx.textAlign = 'center';
            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3.2;
            ctx.font = '900 76px "Cinzel Decorative", "Cinzel", serif';
            ctx.letterSpacing = '8px';
            ctx.fillText(leftData.heading, 1024, 340);
            ctx.strokeText(leftData.heading, 1024, 340);

            ctx.fillStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.font = 'italic 800 50px "EB Garamond", "Playfair Display", serif';
            ctx.letterSpacing = '5px';
            ctx.fillText(leftData.sub, 1024, 435);
            ctx.strokeText(leftData.sub, 1024, 435);

            // Heavy Solid Black Divider
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(650, 490);
            ctx.lineTo(950, 490);
            ctx.moveTo(1098, 490);
            ctx.lineTo(1398, 490);
            ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(1024, 490, 9, 0, Math.PI * 2);
            ctx.fill();

            // Center Artwork Card
            drawEditorialArtwork(ctx, leftData.pictureType, 1024, 1330, 1340, 1380);

            // Caption under picture: HEAVY PURE BLACK ANCIENT ANTIQUE SERIF
            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2.4;
            ctx.font = 'italic 800 72px "EB Garamond", "Playfair Display", serif';
            ctx.textAlign = 'center';
            
            const captionWords = leftData.caption.split(' ');
            let line1 = '';
            let line2 = '';
            for (let i = 0; i < captionWords.length; i++) {
                if (i < Math.ceil(captionWords.length / 2)) line1 += captionWords[i] + ' ';
                else line2 += captionWords[i] + ' ';
            }
            ctx.fillText(line1.trim(), 1024, 2210);
            ctx.strokeText(line1.trim(), 1024, 2210);
            if (line2) {
                ctx.fillText(line2.trim(), 1024, 2300);

            // Intuitive Reading Guide in Heavy Black
            ctx.fillStyle = '#000000';

            ctx.strokeText('◀  Click Left Page or Spine to Close / Go Back  •  Click Right Page to Turn Forward  ▶', 1024, 2465);

            // Bottom Page Number in Heavy Black
            ctx.fillStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.font = '800 52px "Cinzel", serif';
            ctx.fillText(`—  PAGE ${leftData.pageNumber}  —`, 1024, 2635);

            return createHighResPageTexture(canvas);
        }

        function renderRightPageCanvas(rightData) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;

            const ctx = canvas.getContext('2d');

            // High-Contrast Clean Ivory/Parchment Paper

            // Chapter Heading: SOLID HEAVY BLACK ANCIENT ANTIQUE SERIF
            ctx.textAlign = 'center';

            ctx.lineWidth = 3.6;

            // Heavy Solid Black Divider
            ctx.strokeStyle = '#000000';

            ctx.beginPath();
